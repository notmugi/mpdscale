# MPD configuration — deployed to ~/.config/mpd/mpd.conf by setup.sh
# Placeholders (__MUSIC_DIR__, __TS_IP__, __PASSWORD__) are substituted at install time.

music_directory     "__MUSIC_DIR__"
playlist_directory  "~/.local/share/mpd/playlists"
db_file             "~/.local/share/mpd/database"
log_file            "~/.local/share/mpd/log"
pid_file            "~/.local/share/mpd/pid"
state_file          "~/.local/share/mpd/state"
sticker_file        "~/.local/share/mpd/sticker.sql"

# Control port: localhost + tailnet only (NOT exposed to your LAN)
bind_to_address     "localhost"
bind_to_address     "__TS_IP__"
port                "6600"

# Password required for clients connecting over the tailnet
password            "__PASSWORD__@read,add,control,admin"

# --- Audio outputs ---

# Local playback on the machine itself (comment out if headless)
audio_output {
    type    "pipewire"
    name    "Local Playback"
}

# HTTP stream — point your phone's MPD client "stream URL" here
# Reachable at http://__TS_IP__:8000 or http://<hostname>.<tailnet>.ts.net:8000
audio_output {
    type        "httpd"
    name        "Phone Stream"
    encoder     "lame"          # mp3 — universal; change to "vorbis" if you prefer ogg
    port        "8000"
    bind_to_address "0.0.0.0"   # httpd binds per-output; tailscale interface is the only route in from outside anyway
    bitrate     "192"
    format      "44100:16:2"
    always_on   "yes"           # keeps the stream alive between tracks
    tags        "yes"
}

# Replay gain + misc
replaygain          "auto"
auto_update         "yes"
follow_outside_symlinks "yes"
follow_inside_symlinks  "yes"
